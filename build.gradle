plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '3.0.1'
}

group = 'com.raintext'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven {
        url = "https://maven.aliyun.com/repository/public"
    }
    maven {
        url = "https://maven.aliyun.com/repository/google"
    }
    mavenCentral()
}

javafx {
    version = "21.0.1"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.raintext.RainTextApplication'
}

// Build a platform-specific, self-contained native package (exe/msi, dmg, deb)
// via jpackage. The javafx modules are added explicitly so the linked runtime
// image includes them. Run with -PinstallerType=deb|dmg|msi on the matching OS.
jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'RainText'
    }
    addModules('javafx.controls', 'javafx.fxml', 'javafx.base', 'javafx.graphics')
    jpackage {
        installerName = 'RainText'
        appVersion = project.version
        vendor = 'RainText'
        licenseFile = 'LICENSE'
        if (project.hasProperty('installerType')) {
            installerType = project.property('installerType') as String
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    maxParallelForks = 1
    forkEvery = 1
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass
        )
    }
}

task fatJar(type: Jar) {
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
