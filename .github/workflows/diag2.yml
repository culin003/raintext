name: Diag2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Connectivity curl vs java
        shell: bash
        run: |
          echo "=== env proxies ==="
          env | grep -iE "proxy" || echo "no proxy env"
          echo "=== curl ==="
          for h in https://services.gradle.org/distributions/gradle-8.10-bin.zip https://plugins.gradle.org/m2/ https://repo1.maven.org/maven2/ https://maven.aliyun.com/repository/central/ ; do
            echo "curl $h -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$h")"
          done
          echo "=== java tcp ==="
          cat > Conn.java <<'EOF'
          import java.net.*;
          import java.io.*;
          public class Conn { public static void main(String[] a) throws Exception {
            for (String u: new String[]{
              "https://plugins.gradle.org/m2/org/openjfx/javafxplugin/org.openjfx.javafxplugin.gradle.plugin/0.1.0/org.openjfx.javafxplugin.gradle.plugin-0.1.0.pom",
              "https://repo1.maven.org/maven2/org/openjfx/javafxplugin/org.openjfx.javafxplugin.gradle.plugin/0.1.0/org.openjfx.javafxplugin.gradle.plugin-0.1.0.pom",
              "https://maven.aliyun.com/repository/gradle-plugin/org/openjfx/javafxplugin/org.openjfx.javafxplugin.gradle.plugin/0.1.0/org.openjfx.javafxplugin.gradle.plugin-0.1.0.pom"
            }) {
              try {
                HttpURLConnection c=(HttpURLConnection)new URL(u).openConnection();
                c.setInstanceFollowRedirects(true); c.setConnectTimeout(8000); c.setReadTimeout(8000);
                int code=c.getResponseCode();
                System.out.println(code+" "+u);
              } catch(Exception e){ System.out.println("FAIL "+e+" "+u); }
            }
          }}
          EOF
          javac Conn.java && java Conn
