name: Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: amd64, java-arch: x64,    type: deb }
          - { os: ubuntu-24.04-arm, arch: arm64, java-arch: aarch64, type: deb }
          - { os: macos-13,         arch: amd64, java-arch: x64,    type: dmg }
          - { os: macos-latest,     arch: arm64, java-arch: aarch64, type: dmg }
          - { os: windows-latest,   arch: amd64, java-arch: x64,    type: exe }
          # Windows arm64 has no GitHub-hosted runner. To build it, register a
          # self-hosted arm64 Windows runner and uncomment the line below:
          # - { os: [self-hosted, windows, arm64], arch: arm64, type: msi }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: ${{ matrix.java-arch }}

      - name: Set up Gradle (download via curl, bypass the wrapper downloader)
        shell: bash
        run: |
          for url in \
            "https://services.gradle.org/distributions/gradle-8.10-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.10-bin.zip" \
            "https://github.com/culin003/raintext/releases/download/gradle-dist-v8.10/gradle-8.10-bin.zip" ; do
            echo "trying $url"
            if curl -fsSL -o gradle.zip "$url"; then echo "downloaded from $url"; break; fi
          done
          ls -la gradle.zip
          unzip -q gradle.zip
          echo "GRADLE=$PWD/gradle-8.10/bin/gradle" >> "$GITHUB_ENV"

      - name: Build package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          JAVA_OPTS: -Djava.net.preferIPv4Stack=true
          GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
        run: |
          chmod +x "$GRADLE"
          "$GRADLE" jpackage -PinstallerType=${{ matrix.type }} --no-daemon

      - name: Build package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          JAVA_OPTS: -Djava.net.preferIPv4Stack=true
          GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
        run: "$GRADLE" jpackage -PinstallerType=${{ matrix.type }} --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainText-${{ matrix.os }}-${{ matrix.arch }}
          path: build/jpackage/*
          if-no-files-found: error
