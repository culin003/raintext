name: Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: amd64, type: deb }
          - { os: ubuntu-24.04-arm, arch: arm64, type: deb }
          - { os: macos-13,         arch: amd64, type: dmg }
          - { os: macos-latest,     arch: arm64, type: dmg }
          - { os: windows-latest,   arch: amd64, type: exe }
          # Windows arm64 has no GitHub-hosted runner. To build it, register a
          # self-hosted arm64 Windows runner and uncomment the line below:
          # - { os: [self-hosted, windows, arm64], arch: arm64, type: msi }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle (curl)
        shell: bash
        run: |
          for url in \
            "https://services.gradle.org/distributions/gradle-8.10-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.10-bin.zip" \
            "https://github.com/culin003/raintext/releases/download/gradle-dist-v8.10/gradle-8.10-bin.zip" ; do
            echo "trying $url"
            if curl -fsSL -o gradle.zip "$url"; then echo "downloaded from $url"; break; fi
          done
          ls -la gradle.zip
          unzip -q gradle.zip
          echo "GRADLE=$PWD/gradle-8.10/bin/gradle" >> "$GITHUB_ENV"

      - name: Build package
        shell: bash
        run: |
          PROXY_OPTS=""
          if [ -n "$HTTPS_PROXY" ]; then
            HP=$(echo "$HTTPS_PROXY" | sed -E 's#^https?://##; s#/.*##')
            PH=$(echo "$HP" | cut -d: -f1)
            PP=$(echo "$HP" | cut -d: -f2)
            PROXY_OPTS="-Dhttp.proxyHost=$PH -Dhttp.proxyPort=$PP -Dhttps.proxyHost=$PH -Dhttps.proxyPort=$PP"
            echo "using proxy $PH:$PP"
          fi
          export JAVA_OPTS="-Djava.net.preferIPv6Addresses=true $PROXY_OPTS"
          export GRADLE_OPTS="$JAVA_OPTS"
          chmod +x "$GRADLE"
          "$GRADLE" jpackage -PinstallerType=${{ matrix.type }} --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainText-${{ matrix.os }}-${{ matrix.arch }}
          path: build/jpackage/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          REL=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"RainText $TAG\",\"draft\":false}")
          UP=$(echo "$REL" | grep -oE '"upload_url": "[^"]*"' | sed -E 's/.*"([^"]*)".*/\1/' | sed 's/{.*//')
          if [ -z "$UP" ]; then
            REL=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
            UP=$(echo "$REL" | grep -oE '"upload_url": "[^"]*"' | sed -E 's/.*"([^"]*)".*/\1/' | sed 's/{.*//')
          fi
          for f in build/jpackage/*; do
            name=$(basename "$f")
            echo "uploading $name"
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$UP?name=$name"
          done
